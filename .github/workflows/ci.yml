# Every pull request and push: lint, types, unit tests, web build and Playwright e2e.
# Pushes to main then build both images and roll them out to Cloud Run (see infra/README.md).
# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) bumps them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-

      - run: pnpm install --frozen-lockfile

      # Same image and flags as docker-compose.yml, minus the host volume.
      - name: Start the Cloud Storage emulator
        run: >-
          docker run --detach --name gcs --publish 4443:4443 fsouza/fake-gcs-server:1.52
          -scheme http -port 4443 -public-host localhost:4443

      - run: pnpm check

      - run: pnpm test

      - run: pnpm --filter @vinyl/web build

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: check
    # Skipped until the repository variables from `terraform output github_variables` are set.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.GCP_WIF_PROVIDER != '' && vars.GCP_API_SERVICE != '' && vars.GCP_WEB_SERVICE != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Deploys never overlap; a newer push replaces one still waiting.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_IMAGE_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No layer cache: the Dockerfile copies the whole repo before installing, so every commit
      # misses it anyway.
      - name: Build and push api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          push: true
          provenance: false
          tags: ${{ env.REPO }}/api:${{ steps.tag.outputs.tag }}

      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          provenance: false
          tags: ${{ env.REPO }}/web:${{ steps.tag.outputs.tag }}
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}

      # The api first, so the web revision never calls an older api than it was built with.
      # --to-latest undoes a manual rollback, which pins traffic to an older revision.
      - name: Deploy to Cloud Run
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          API_SERVICE: ${{ vars.GCP_API_SERVICE }}
          WEB_SERVICE: ${{ vars.GCP_WEB_SERVICE }}
        run: |
          for pair in "api:$API_SERVICE" "web:$WEB_SERVICE"; do
            app=${pair%%:*} service=${pair#*:}
            gcloud run services update "$service" --region="$REGION" --image="$REPO/$app:$TAG" --quiet
            gcloud run services update-traffic "$service" --region="$REGION" --to-latest --quiet
          done
